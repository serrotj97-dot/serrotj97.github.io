<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quest AI Portal</title>
<!-- A-Frame from CDN (no build step) -->
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<style>
/* ===== Dark futuristic HUD + loading screen ===== */
html,body{margin:0;height:100%;background:#000;font-family:"Segoe UI",system-ui,sans-serif}
#loading{position:fixed;inset:0;z-index:100;background:radial-gradient(circle,#0b1a33,#000);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#7ff;letter-spacing:3px;transition:opacity .6s}
#loading .spin{width:70px;height:70px;border:4px solid #0ff3;border-top-color:#0ff;border-radius:50%;animation:sp 1s linear infinite;margin-bottom:18px}
@keyframes sp{to{transform:rotate(360deg)}}
#hud{position:fixed;left:12px;top:12px;z-index:50;width:340px;max-width:calc(100vw - 24px);color:#cfe;background:rgba(5,10,25,.82);border:1px solid #0ff6;border-radius:12px;box-shadow:0 0 18px #0ff4;padding:12px;font-size:13px}
#hud h1{margin:0 0 6px;font-size:15px;color:#0ff;letter-spacing:2px}
#hud .row{margin:4px 0}#hud b{color:#f0f}
#transcript{height:110px;overflow-y:auto;background:#0008;border:1px solid #0ff3;border-radius:6px;padding:6px;margin:6px 0;font-size:12px}
#transcript .you{color:#9ef}#transcript .ai{color:#fd8}
#hud button{background:#0a2540;color:#0ff;border:1px solid #0ff;border-radius:6px;padding:7px 9px;margin:3px 2px;font-weight:600;cursor:pointer}
#hud button:hover,#hud button.on{background:#0ff;color:#012}
#enterBtn{background:#204 !important;color:#f8f !important;border-color:#f0f !important}
#exitBtn{display:none}
</style>
</head>
<body>
<!-- ===== Loading screen ===== -->
<div id="loading"><div class="spin"></div>INITIALIZING PORTAL…</div>

<!-- ===== HUD (also the dom-overlay root in AR) ===== -->
<div id="hud">
  <h1>◈ AI PORTAL</h1>
  <div class="row">Active: <b id="activeName">none</b></div>
  <div class="row">Status: <span id="status">Loading…</span></div>
  <div id="transcript"></div>
  <button id="enterBtn">Enter XR</button>
  <button id="summonBtn">Summon</button>
  <button id="talkBtn">Talk</button>
  <button id="placeBtn">Place mode</button>
  <button id="exitBtn">Exit</button>
</div>

<!-- ===== Scene =====
 webxr: AR requested with hit-test + local-floor; dom-overlay/anchors optional; overlay root = #hud -->
<a-scene id="scene" vr-mode-ui="enabled:false" renderer="antialias:true;colorManagement:true"
  webxr="requiredFeatures: hit-test,local-floor; optionalFeatures: dom-overlay,anchors; overlayElement: #hud"
  cursor="rayOrigin: mouse" raycaster="objects: .selectable">
  <a-entity light="type:ambient;intensity:0.6"></a-entity>
  <a-entity light="type:directional;intensity:0.8" position="1 3 2"></a-entity>
  <a-sky id="sky" color="#05060f"></a-sky>

  <!-- Camera rig + controllers -->
  <a-entity id="rig">
    <a-entity id="cam" camera look-controls wasd-controls position="0 1.6 0"></a-entity>
    <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .selectable; far: 20"></a-entity>
    <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .selectable; far: 20"></a-entity>
  </a-entity>

  <!-- Summoning portal: emissive torus + particle rings + sparkles -->
  <a-entity id="portal" position="0 0.02 -2">
    <a-torus id="portalTorus" rotation="-90 0 0" radius="0.6" radius-tubular="0.04" segments-tubular="48"
      material="color:#6a0dad;emissive:#c040ff;emissiveIntensity:1.5"
      animation="property: rotation; to: -90 360 0; loop:true; dur:8000; easing:linear"></a-torus>
    <a-entity particle-ring="radius:0.7;count:24;color:#0ff;speed:0.6"></a-entity>
    <a-entity particle-ring="radius:0.5;count:16;color:#f0f;speed:-1"></a-entity>
    <a-entity id="sparkles" sparkles="max:60"></a-entity>
  </a-entity>

  <!-- Hit-test reticle + ghost preview -->
  <a-ring id="reticle" visible="false" rotation="-90 0 0" radius-inner="0.08" radius-outer="0.11" material="color:#0f8;shader:flat"></a-ring>
  <a-entity id="ghost" visible="false"></a-entity>
</a-scene>

<script>
/* =====================================================================
   CONFIG — paste your xAI key / endpoint / model here.
   WARNING: a key embedded in client-side code is visible to ANYONE who
   has this file or opens dev tools. Personal / local use only.
   ===================================================================== */
const XAI_API_KEY  = '';                                   // e.g. 'xai-...'
const XAI_ENDPOINT = 'https://api.x.ai/v1/chat/completions';
const XAI_MODEL    = 'grok-4';                             // placeholder, change as needed
const WAKE_WORD    = 'summon';

/* ===== Character definitions ===== */
const CHARACTERS = [
  { id:'orb', name:'Orb Bot', color:'#00e5ff', accent:'#ff00ff', pitch:1.6, rate:1.15,
    personality:'You are Orb Bot, a cheerful, curious glowing orb who speaks in upbeat, playful sentences.',
    lines:['Bleep! Orb Bot online and glowing!','Ooh, great question. My rings are spinning with ideas!','I am ninety percent light and ten percent curiosity.'] },
  { id:'chief', name:'Chief of Staff', color:'#2b3a55', accent:'#ffb000', pitch:0.8, rate:0.95,
    personality:'You are Chief of Staff, a calm, efficient executive assistant. Concise, organized, action-oriented.',
    lines:['Noted. I will add that to the agenda.','Priority one: stay focused. Priority two: hydrate.','Your schedule is clear. Shall we proceed?'] },
  { id:'sprocket', name:'Sprocket', color:'#ff7a1a', accent:'#7cff4f', pitch:1.2, rate:1.3,
    personality:'You are Sprocket, an excitable tinkerer robot who loves gadgets and talks about building things.',
    lines:['Ooh, I could build that with two gears and a paperclip!','Hold on, tightening a bolt in my head.','Every problem is just a machine waiting to be invented!'] }
];

/* ===== AI responses: xAI fetch with scripted fallback ===== */
function getAIResponse(userText, personality) {
  const ch = CHARACTERS.find(c => c.personality === personality) || CHARACTERS[0];
  const fallback = () => ch.lines[Math.floor(Math.random() * ch.lines.length)];
  if (!XAI_API_KEY) return Promise.resolve(fallback());
  return fetch(XAI_ENDPOINT, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + XAI_API_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: XAI_MODEL, max_tokens: 120, messages: [
      { role: 'system', content: personality + ' Reply in at most two short sentences; your words are spoken aloud.' },
      { role: 'user', content: userText } ] })
  }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(j => (j.choices && j.choices[0].message.content) || fallback())
    .catch(e => { console.warn('AI fallback:', e); return fallback(); });
}

/* ===== Components ===== */
// Billboard: rotate entity to face the camera every frame.
AFRAME.registerComponent('billboard', {
  init(){ this.v = new THREE.Vector3(); },
  tick(){ const cam = this.el.sceneEl.camera; if (!cam) return;
    cam.getWorldPosition(this.v); this.el.object3D.lookAt(this.v); }
});

// Particle ring: N small spheres orbiting in a single InstancedMesh (cheap).
AFRAME.registerComponent('particle-ring', {
  schema:{ radius:{default:0.7}, count:{default:20}, color:{default:'#0ff'}, speed:{default:1} },
  init(){ const d = this.data;
    this.mesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.02,6,4),
      new THREE.MeshBasicMaterial({color:d.color}), d.count);
    this.el.setObject3D('mesh', this.mesh); this.m = new THREE.Matrix4(); this.boost = 1; },
  pulse(){ this.boost = 2.5; },
  tick(t){ const d = this.data; this.boost += (1 - this.boost) * 0.05;
    for (let i = 0; i < d.count; i++){ const a = i / d.count * Math.PI * 2 + t / 1000 * d.speed;
      const r = d.radius * (0.8 + 0.2 * this.boost);
      this.m.makeTranslation(Math.cos(a)*r, 0.05 + Math.sin(t/300 + i)*0.03*this.boost, Math.sin(a)*r);
      this.mesh.setMatrixAt(i, this.m); }
    this.mesh.instanceMatrix.needsUpdate = true; }
});

// Sparkles: pooled point particles in one BufferGeometry; burst() reuses dead slots.
AFRAME.registerComponent('sparkles', {
  schema:{ max:{default:60} },
  init(){ const n = this.data.max;
    this.pos = new Float32Array(n*3); this.vel = new Float32Array(n*3); this.life = new Float32Array(n);
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(this.pos,3));
    this.pts = new THREE.Points(g, new THREE.PointsMaterial({color:'#fff6ff', size:0.03, transparent:true, opacity:0.9}));
    this.pts.frustumCulled = false; this.el.setObject3D('mesh', this.pts); this.acc = 0; },
  spawn(speed){ const i = this.life.findIndex(l => l <= 0); if (i < 0) return;
    const a = Math.random()*Math.PI*2, r = 0.6;
    this.pos.set([Math.cos(a)*r, 0.05, Math.sin(a)*r], i*3);
    this.vel.set([(Math.random()-.5)*speed, Math.random()*speed+0.2, (Math.random()-.5)*speed], i*3);
    this.life[i] = 1 + Math.random(); },
  burst(){ for (let k = 0; k < this.data.max; k++) this.spawn(1.5); },
  tick(t, dt){ dt = Math.min(dt || 16, 50) / 1000; this.acc += dt;
    if (this.acc > 0.15){ this.acc = 0; this.spawn(0.2); }       // idle trickle
    for (let i = 0; i < this.data.max; i++){ if (this.life[i] <= 0){ this.pos[i*3+1] = -999; continue; }
      this.life[i] -= dt; for (let k = 0; k < 3; k++) this.pos[i*3+k] += this.vel[i*3+k]*dt; }
    this.pts.geometry.attributes.position.needsUpdate = true; }
});

/* ===== App state + helpers ===== */
const $ = id => document.getElementById(id);
const sceneEl = $('scene');
const S = { chars:{}, summoned:[], selected:null, speaking:null, placeMode:false, listening:false,
  triggers:{left:false,right:false}, grab:null, hitSource:null, hitResult:null, anchors:new Map(), lastHitPose:null };

function setStatus(t){ $('status').textContent = t; }
function log(who, text, cls){ const d = document.createElement('div'); d.className = cls;
  d.textContent = who + ': ' + text; $('transcript').appendChild(d); $('transcript').scrollTop = 1e6; }

/* ===== Character construction from primitives ===== */
function el(tag, attrs, parent){ const e = document.createElement(tag);
  // Pass material etc. as object values so A-Frame parses them against the right shader.
  for (const k in attrs) e.setAttribute(k, k === 'material' ? AFRAME.utils.styleParser.parse(attrs[k]) : attrs[k]);
  if (parent) parent.appendChild(e); return e; }

function buildBody(def, parent, ghost){
  const mat = c => ghost ? 'color:'+c+';opacity:0.35;transparent:true' : 'color:'+c+';emissive:'+c+';emissiveIntensity:0.35';
  if (def.id === 'orb'){
    el('a-sphere', {radius:0.22, position:'0 0.45 0', material: ghost?mat(def.color):'color:'+def.color+';emissive:'+def.color+';emissiveIntensity:1'}, parent);
    el('a-torus', {radius:0.34, 'radius-tubular':0.012, position:'0 0.45 0', rotation:'70 0 0', material:mat(def.accent),
      animation:'property:rotation;to:70 360 0;loop:true;dur:4000;easing:linear'}, parent);
    el('a-torus', {radius:0.4, 'radius-tubular':0.01, position:'0 0.45 0', rotation:'110 0 0', material:mat(def.accent),
      animation:'property:rotation;to:110 -360 0;loop:true;dur:6000;easing:linear'}, parent);
  } else if (def.id === 'chief'){
    el('a-box', {width:0.32, height:0.9, depth:0.2, position:'0 0.45 0', material:mat(def.color)}, parent);
    el('a-box', {width:0.26, height:0.26, depth:0.22, position:'0 1.05 0', material:mat(def.color)}, parent);
    el('a-box', {width:0.24, height:0.06, depth:0.02, position:'0 1.07 0.115', material: ghost?mat(def.accent):'color:'+def.accent+';emissive:'+def.accent+';emissiveIntensity:2'}, parent);
  } else {
    el('a-cylinder', {radius:0.18, height:0.5, position:'0 0.35 0', material:mat(def.color)}, parent);
    el('a-cylinder', {radius:0.12, height:0.12, position:'0 0.68 0', material:mat(def.accent)}, parent);
    el('a-box', {width:0.06, height:0.06, depth:0.3, position:'0.24 0.4 0.05', material:mat(def.accent),
      animation:'property:rotation;to:0 0 360;loop:true;dur:2000;easing:linear'}, parent);
    el('a-sphere', {radius:0.04, position:'0 0.8 0', material:mat(def.accent)}, parent);
  }
}

function createCharacter(def){
  const root = el('a-entity', {class:'character', visible:false, scale:'0.01 0.01 0.01'}, sceneEl);
  root.dataset.cid = def.id;
  const bob = el('a-entity', {class:'selectable', animation:'property:position;from:0 0 0;to:0 0.08 0;dir:alternate;loop:true;dur:1600;easing:easeInOutSine'}, root);
  buildBody(def, bob, false);
  el('a-cylinder', {radius:0.35, height:1.2, position:'0 0.6 0', material:'opacity:0;transparent:true;depthWrite:false'}, bob); // click hitbox
  el('a-text', {value:def.name, align:'center', color:'#fff', width:2.5, position:'0 1.45 0', billboard:''}, root);
  const hl = el('a-torus', {radius:0.4, 'radius-tubular':0.015, rotation:'-90 0 0', position:'0 0.02 0', visible:false, material:'color:#0f0;shader:flat'}, root);
  const talk = el('a-ring', {'radius-inner':0.42, 'radius-outer':0.48, rotation:'-90 0 0', position:'0 0.03 0', visible:false,
    material:'color:'+def.accent+';shader:flat;transparent:true;opacity:0.8',
    animation:'property:scale;from:1 1 1;to:1.35 1.35 1.35;dir:alternate;loop:true;dur:350'}, root);
  bob.addEventListener('click', () => select(def.id));
  S.chars[def.id] = { def, root, hl, talk, summoned:false };
}

/* ===== Selection ===== */
function select(id){
  if (S.selected) S.chars[S.selected].hl.setAttribute('visible', false);
  S.selected = id; const c = S.chars[id]; c.hl.setAttribute('visible', true);
  $('activeName').textContent = c.def.name; setStatus(c.def.name + ' selected'); refreshGhost();
}

/* ===== Summoning ===== */
function pulsePortal(){
  const t = $('portalTorus');
  t.setAttribute('animation__pulse', 'property:scale;from:1.4 1.4 1.4;to:1 1 1;dur:700;easing:easeOutElastic');
  t.setAttribute('animation__glow', 'property:material.emissiveIntensity;from:5;to:1.5;dur:900');
  document.querySelectorAll('[particle-ring]').forEach(e => e.components['particle-ring'].pulse());
  $('sparkles').components.sparkles.burst();
}
function summon(){
  pulsePortal();
  const def = CHARACTERS.find(d => !S.chars[d.id].summoned);
  if (!def){ setStatus('All characters are already here'); return; }
  const c = S.chars[def.id]; c.summoned = true;
  const p = $('portal').object3D.position;
  const offset = (Object.values(S.chars).filter(x => x.summoned).length - 2) * 0.9;
  c.root.setAttribute('position', {x:p.x, y:p.y - 0.8, z:p.z});
  c.root.setAttribute('visible', true);
  c.root.setAttribute('animation__rise', 'property:position;to:'+(p.x+offset)+' '+p.y+' '+(p.z+0.3)+';dur:1500;easing:easeOutCubic');
  c.root.setAttribute('animation__grow', 'property:scale;from:0.01 0.01 0.01;to:1 1 1;dur:1500;easing:easeOutBack');
  select(def.id); log('Portal', def.name + ' has arrived', 'ai');
}

/* ===== Voice: SpeechRecognition + speechSynthesis ===== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (SR){ rec = new SR(); rec.lang = 'en-US'; rec.interimResults = false; rec.continuous = false;
  rec.onresult = e => { const text = e.results[0][0].transcript.trim(); handleSpeech(text); };
  rec.onend = () => { S.listening = false; $('talkBtn').classList.remove('on'); };
  rec.onerror = e => setStatus('Mic error: ' + e.error);
}
function listen(){
  if (!rec){ const t = prompt('Speech recognition unavailable. Type a message:'); if (t) handleSpeech(t); return; }
  if (S.listening){ rec.stop(); return; }
  try { rec.start(); S.listening = true; $('talkBtn').classList.add('on'); setStatus('Listening…'); } catch(e){ console.warn(e); }
}
function handleSpeech(text){
  log('You', text, 'you');
  if (text.toLowerCase().includes(WAKE_WORD)){ summon(); return; }      // wake word
  if (!S.selected){ setStatus('Summon or select a character first'); return; }
  const c = S.chars[S.selected]; setStatus(c.def.name + ' is thinking…');
  getAIResponse(text, c.def.personality).then(reply => { log(c.def.name, reply, 'ai'); speak(c, reply); });
}
function speak(c, text){
  if (S.speaking) S.chars[S.speaking].talk.setAttribute('visible', false);
  S.speaking = c.def.id; c.talk.setAttribute('visible', true); setStatus(c.def.name + ' is speaking');
  const done = () => { c.talk.setAttribute('visible', false); if (S.speaking === c.def.id) S.speaking = null; setStatus('Ready'); };
  if (!window.speechSynthesis){ setTimeout(done, 2000); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.pitch = c.def.pitch; u.rate = c.def.rate;
  u.onend = done; u.onerror = done; speechSynthesis.speak(u);
}

/* ===== Placement: ghost preview, hit-test, anchors ===== */
function placementTarget(){
  if (S.selected) return S.selected;
  const next = CHARACTERS.find(d => !S.chars[d.id].summoned); return next ? next.id : null;
}
function refreshGhost(){
  const g = $('ghost'); while (g.firstChild) g.removeChild(g.firstChild);
  const id = placementTarget(); if (id) buildBody(S.chars[id].def, g, true);
}
function togglePlace(){
  S.placeMode = !S.placeMode; $('placeBtn').classList.toggle('on', S.placeMode); refreshGhost();
  setStatus(S.placeMode ? 'Place mode: aim at a surface, right trigger to place' : 'Ready');
  if (!S.placeMode){ $('ghost').setAttribute('visible', false); $('reticle').setAttribute('visible', false); }
}
function confirmPlacement(){
  const pose = S.lastHitPose; const id = placementTarget(); if (!pose || !id) return;
  const c = S.chars[id];
  if (!c.summoned){ c.summoned = true; c.root.setAttribute('visible', true); c.root.setAttribute('scale', '1 1 1'); }
  c.root.removeAttribute('animation__rise');
  c.root.object3D.position.copy(pose.position);
  S.anchors.delete(id);
  // Try a real XRAnchor; otherwise the static pose above stays.
  const hr = S.hitResult;
  if (hr && hr.createAnchor){ hr.createAnchor().then(a => S.anchors.set(id, a)).catch(() => {}); }
  select(id); log('System', c.def.name + ' placed' + (hr && hr.createAnchor ? ' (anchored)' : ''), 'ai');
}

// Per-frame system: hit-test, ghost/reticle, anchors, grab, desktop fallback placement.
AFRAME.registerComponent('xr-manager', {
  init(){ this.tmp = new THREE.Vector3(); this.mat = new THREE.Matrix4(); this.ray = new THREE.Raycaster();
    this.floor = new THREE.Plane(new THREE.Vector3(0,1,0), 0); },
  tick(){
    const scene = this.el, frame = scene.frame, renderer = scene.renderer;
    const ref = renderer.xr.isPresenting ? renderer.xr.getReferenceSpace() : null;
    S.lastHitPose = null; S.hitResult = null;
    // --- Hit-test (AR) ---
    if (frame && ref && S.hitSource){
      const res = frame.getHitTestResults(S.hitSource);
      if (res.length){ const p = res[0].getPose(ref);
        if (p){ S.hitResult = res[0]; this.mat.fromArray(p.transform.matrix);
          S.lastHitPose = { position: new THREE.Vector3().setFromMatrixPosition(this.mat) }; } }
    }
    // --- Fallback (VR / desktop): intersect right ray or mouse with floor plane ---
    if (!S.lastHitPose && S.placeMode){
      const rh = $('rightHand').components.raycaster;
      if (renderer.xr.isPresenting && rh){ this.ray.ray.copy(rh.raycaster.ray); }
      else { const m = scene.components.cursor && scene.components.cursor.mouse;
        if (m && scene.camera) this.ray.setFromCamera(m, scene.camera); }
      if (this.ray.ray.intersectPlane(this.floor, this.tmp)) S.lastHitPose = { position: this.tmp.clone() };
    }
    const show = S.placeMode && !!S.lastHitPose;
    $('reticle').object3D.visible = show; $('ghost').object3D.visible = show;
    if (show){ $('reticle').object3D.position.copy(S.lastHitPose.position); $('ghost').object3D.position.copy(S.lastHitPose.position); }
    // --- Anchors: update anchored characters every frame ---
    if (frame && ref) S.anchors.forEach((a, id) => {
      const p = frame.getPose(a.anchorSpace, ref);
      if (p){ this.mat.fromArray(p.transform.matrix); S.chars[id].root.object3D.position.setFromMatrixPosition(this.mat); } });
    // --- Grab: keep character on controller ray at grab distance ---
    if (S.grab){ const rc = S.grab.hand.components.raycaster; if (rc){ const r = rc.raycaster.ray;
      S.chars[S.grab.id].root.object3D.position.copy(r.origin).addScaledVector(r.direction, S.grab.dist).add(S.grab.offset); } }
  }
});
sceneEl.setAttribute('xr-manager', '');

/* ===== Controller input ===== */
function hitCharId(hand){
  const rc = hand.components.raycaster; if (!rc || !rc.intersectedEls.length) return null;
  let e = rc.intersectedEls[0]; while (e && !e.dataset.cid) e = e.parentEl; return e ? e.dataset.cid : null;
}
['left','right'].forEach(side => {
  const hand = $(side + 'Hand');
  hand.addEventListener('triggerdown', () => {
    S.triggers[side] = true;
    if (S.triggers.left && S.triggers.right){ summon(); return; }      // both triggers = portal
    const id = hitCharId(hand);
    if (side === 'right' && S.placeMode && !id){ confirmPlacement(); return; }
    if (id) select(id);
  });
  hand.addEventListener('triggerup', () => { S.triggers[side] = false; });
  hand.addEventListener('gripdown', () => {
    const id = hitCharId(hand); if (!id) return;
    const r = hand.components.raycaster.raycaster.ray, pos = S.chars[id].root.object3D.position;
    const dist = hand.components.raycaster.intersections[0].distance;
    const offset = pos.clone().sub(r.origin.clone().addScaledVector(r.direction, dist));
    S.anchors.delete(id); S.grab = { id, hand, dist, offset }; select(id);
  });
  hand.addEventListener('gripup', () => { S.grab = null; });
});
$('rightHand').addEventListener('abuttondown', listen);                 // A = push-to-talk
$('rightHand').addEventListener('thumbstickmoved', e => {               // right stick rotates
  if (!S.selected || Math.abs(e.detail.x) < 0.2) return;
  S.chars[S.selected].root.object3D.rotation.y -= e.detail.x * 0.06;
});

/* ===== XR session: enter, hit-test source, exit/reset ===== */
let arSupported = false;
if (navigator.xr){ navigator.xr.isSessionSupported('immersive-ar').then(ok => {
  arSupported = ok; $('enterBtn').textContent = ok ? 'Enter AR' : 'Enter VR'; }).catch(() => { $('enterBtn').textContent = 'Enter VR'; }); }
else $('enterBtn').textContent = 'XR unavailable';

$('enterBtn').onclick = () => {
  if (!navigator.xr){ setStatus('WebXR not available in this browser'); return; }
  const p = arSupported ? sceneEl.enterAR() : sceneEl.enterVR();
  Promise.resolve(p).catch(e => { console.warn(e); setStatus('XR failed: ' + e.message); });
};
sceneEl.addEventListener('enter-vr', () => {
  $('exitBtn').style.display = 'inline-block'; $('enterBtn').style.display = 'none';
  const ar = sceneEl.is('ar-mode'); $('sky').setAttribute('visible', !ar);
  const session = sceneEl.renderer.xr.getSession(); if (!session) return;
  setStatus(ar ? 'AR session started' : 'VR session started');
  if (session.requestHitTestSource){
    session.requestReferenceSpace('viewer').then(vs => session.requestHitTestSource({ space: vs }))
      .then(src => { S.hitSource = src; }).catch(e => console.warn('hit-test unavailable', e));
  }
  session.addEventListener('end', resetSession);
});
function resetSession(){
  if (S.hitSource){ try { S.hitSource.cancel(); } catch(e){} }
  S.hitSource = null; S.hitResult = null; S.anchors.clear(); S.grab = null;
  S.triggers = {left:false,right:false}; if (S.placeMode) togglePlace();
  if (window.speechSynthesis) speechSynthesis.cancel(); if (rec && S.listening) rec.stop();
  $('exitBtn').style.display = 'none'; $('enterBtn').style.display = 'inline-block';
  $('sky').setAttribute('visible', true); setStatus('Session ended');
}
$('exitBtn').onclick = () => { const s = sceneEl.renderer.xr.getSession(); if (s) s.end(); else sceneEl.exitVR(); };

/* ===== HUD buttons (beforexrselect stops overlay taps from also firing XR select) ===== */
$('hud').addEventListener('beforexrselect', e => e.preventDefault());
$('summonBtn').onclick = summon;
$('talkBtn').onclick = listen;
$('placeBtn').onclick = togglePlace;
// Desktop: clicking the floor while in place mode places the character.
sceneEl.addEventListener('mousedown', e => { if (S.placeMode && e.target === sceneEl.canvas) setTimeout(confirmPlacement, 0); });

/* ===== Boot: build characters, hide loading screen ===== */
function boot(){
  CHARACTERS.forEach(createCharacter); refreshGhost();
  const l = $('loading'); l.style.opacity = 0; setTimeout(() => l.remove(), 700);
  setStatus('Ready: say "' + WAKE_WORD + '" or press Summon');
}
if (sceneEl.hasLoaded) boot(); else sceneEl.addEventListener('loaded', boot);
</script>
